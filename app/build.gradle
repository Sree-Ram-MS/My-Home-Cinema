plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myhomecinema.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.myhomecinema.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // No external dependencies on purpose: pure Java + Android platform APIs.
    // That keeps the build simple and the APK small.
}
